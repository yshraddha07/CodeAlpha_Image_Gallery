<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Image Gallery</h1>

        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain view" data-index="0">

<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Beach view" data-index="1">

<img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80" alt="Forest view" data-index="2">

<img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80" alt="City view" data-index="3">

<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Lake view" data-index="4">

<img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Sunset view" data-index="5">
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close" id="close">&times;</button>
        <button class="prev" id="prev">&#10094;</button>
        <img id="lightboxImage" src="images/photo1.svg" alt="Selected image">
        <button class="next" id="next">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
